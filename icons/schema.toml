#:schema ./schema-definition.json
# Draft contract for icon TSV files. Existing files have not yet been migrated.
# This is a project-specific schema vocabulary, not a standard TOML schema.
# Columns are identified by table key; TOML table order is not significant.
# format.column_order defines canonical export order; readers accept any order.
# `required` governs header presence; `allow_empty` governs cells and list items.
# item_pattern overrides format.item_pattern and uses full-string matching.
# For strings it matches the whole cell; for lists it matches each split item.

schema_version = 1
status = "draft"

[format]
column_order = ["code_points", "chars", "tab_completions", "unicode_name", "base"]
# TSV readers require unique headers and exactly one field per header in each row.
encoding = "utf-8"
delimiter = "\t"
quotechar = '"'
doublequote = true
# Canonical exports use LF; the final LF is optional. Quote fields containing
# tabs/CR/LF or literal double quotes, doubling quotes within quoted fields.
# Python readers follow csv parsing rules, accepting CR/CRLF and ignoring blank lines.
line_terminator = "\n"
header = true
allow_unknown_columns = false
item_type = "string"
# Accept every character, including tabs, line breaks, and carriage returns.
# Empty values remain subject to each column's allow_empty setting.
item_pattern = '[\s\S]*'

# Split on the exact delimiter, not bare commas; preserve item order.
# An empty cell means an empty list, subject to the column's allow_empty setting.
# A trailing separator produces an empty item, also subject to allow_empty.
list_separator = ", "

[columns]
[columns.code_points]
required = true
allow_empty = false
type = "list"
min_items = 1
item_pattern = 'U\+[0-9A-F]{4,6}'
description = """
Nonempty comma-space-separated list of the replacement text's Unicode scalar
values, in order. Use uppercase hexadecimal with at least four digits.
Repeated code points are allowed, including in phrases.
Values must be U+0000 through U+10FFFF, excluding U+D800 through U+DFFF.
Decoding the values in order must reproduce chars exactly.
"""
examples = ["U+03B1", "U+003D, U+0338", "U+2705, U+FE0F"]

[columns.chars]
required = true
allow_empty = false
type = "string"
description = """
Exact replacement text, without padding added solely for display.
Preserve whitespace exactly; do not strip or Unicode-normalize the text.
"""
examples = ["α", "≠", "✅️"]

[columns.tab_completions]
required = true
allow_empty = true
type = "list"
item_pattern = '\\[\x21-\x5B\x5D-\x7E]+'
unique_items = true
description = """
Comma-space-separated completion aliases. Each alias begins with a backslash,
followed by one or more printable ASCII characters other than backslash
(U+0021 through U+007E, excluding U+005C). Spaces are forbidden within aliases.
The terminating space used to trigger AutoKey expansion is implicit and must
not be stored. An empty cell means no aliases. A bare comma within an alias
is allowed because it cannot be followed by a space within that alias.
"""
examples = ['\alpha', '\neq, \ne', '\:copyright:, \copyright']

[columns.unicode_name]
required = true
allow_empty = true
type = "string"
description = """
For a single character, optionally followed by one variation selector or one
combining mark in U+0300..U+036F, match the base character's unicode_name in
icons/unicode.tsv, ignoring case. This includes matching empty names for
unnamed characters present in that table.
Name checks are skipped for characters absent from the table and for other
multi-code-point sequences. Whitespace is significant.
"""
examples = ["GREEK SMALL LETTER ALPHA", "", "DOUBLE-STRUCK CAPITAL N"]

[columns.base]
required = false
allow_empty = true
type = "string"
item_pattern = '[\s\S]'
description = """
Optional project-defined counterpart, usually the unstyled or baseline
character, for example 'N' for 'ℕ'. Must be exactly one Unicode scalar value
when populated, not an arbitrary grapheme cluster or string. It may be inferred
from selected compatibility decompositions or manually curated. Empty means
unspecified. This relationship does not imply interchangeability.
"""
examples = ["a", "0"]
