#:schema ./schema-definition.json
# Draft contract for icon TSV files.
# This is a project-specific schema vocabulary, not a standard TOML schema.
# Columns are identified by table key; TOML table order is not significant.
# format.required_columns defines mandatory headers and canonical export order.
# Readers accept any header order; allow_empty governs cells and list items.
# Each column requires item_pattern; all values and list items are strings.
# A nonempty list_separator defines a list column; omit it for a single string.
# item_pattern uses full-string matching.
# For strings it matches the whole cell; for lists it matches each split item.
# Only list columns split on list_separator; preserve item order and empty items.
# An empty list cell means an empty list, subject to the column's allow_empty.

schema_version = 1
status = "draft"

[format]
required_columns = ["code_points", "chars", "tab_completions", "unicode_name"]
# TSV readers require unique headers and exactly one field per header in each row.
encoding = "utf-8"
delimiter = "\t"
quoting = "none"
# Quoting and escaping are disabled: quotes and backslashes are literal data.
# Fields must not contain tabs, CR, or LF. Records use LF; the final LF is optional.
# Python readers also accept CR/CRLF record separators and ignore blank lines.
line_terminator = "\n"
header = true
# Extra columns are optional metadata; only the defined columns are validated.
allow_unknown_columns = true

[columns]
[columns.code_points]
allow_empty = false
min_items = 1
item_pattern = 'U\+[0-9A-F]{4,6}'
list_separator = ", "
description = """
Nonempty comma-space-separated list of the replacement text's Unicode scalar
values, in order. Use uppercase hexadecimal with at least four digits.
Repeated code points are allowed, including in phrases.
Values must be U+0000 through U+10FFFF, excluding U+D800 through U+DFFF.
Decoding the values in order must reproduce chars exactly when it is populated,
including all variation selectors.
When chars is empty, readers reconstruct the text from these values instead.
"""
examples = ["U+03B1", "U+003D, U+0338", "U+2705, U+FE0F"]

[columns.chars]
allow_empty = true
item_pattern = '[^\t\r\n]*'
description = """
Exact replacement text, without padding added solely for display.
When populated, it must equal the decoded code_points sequence exactly.
Every variation selector in chars must also be listed in code_points, in order;
selectors must not be added, removed, or substituted.
No other added characters are allowed, including NBSP padding around combining
marks. These relationships are checked by the icon validator by default.
Preserve whitespace exactly; do not strip or Unicode-normalize the text.
An empty cell means reconstruct the text from code_points, not an empty replacement.
Leave the entire cell empty when the text contains a tab, CR, or LF.
"""
examples = ["α", "≠", "✅️", ""]

[columns.tab_completions]
allow_empty = true
# Printable ASCII U+0021..U+007E, including backslash (U+005C), excluding space.
# [\x21-\x5B\x5D-\x7E] would exclude backslash by leaving a gap at \x5C.
item_pattern = '\\[\x21-\x7E]+'
list_separator = ", "
unique_items = true
description = """
Comma-space-separated completion aliases. Each alias begins with a backslash,
followed by one or more printable ASCII characters (U+0021 through U+007E),
including backslash. Spaces are forbidden within aliases.
The terminating space used to trigger AutoKey expansion is implicit and must
not be stored. An empty cell means no aliases. A bare comma within an alias
is allowed because it cannot be followed by a space within that alias.
"""
examples = ['\alpha', '\neq, \ne', '\:copyright:, \copyright', '\sc\L']

[columns.unicode_name]
allow_empty = false
min_items = 1
# Allowed-character surrogate for Unicode 18.0, Section 4.8, Name Syntax (R1):
# https://www.unicode.org/versions/Unicode18.0.0/core-spec/chapter-4/
# Also accept lowercase ASCII for title-cased exports. Positional rules R2-R4
# are not enforced here; --check-icons checks actual names against the UCD.
# Full grammar: UAX #44, Section 5.11.4, Tables 20-21:
# https://www.unicode.org/reports/tr44/#Validation
item_pattern = "[A-Za-z0-9 -]+"
list_separator = ", "
description = """
Comma-space-separated current Unicode names in code_points order, including
variation selectors. Repeated names are allowed. Use ASCII letters, digits,
spaces, and hyphens; case is ignored. The pattern checks allowed characters,
not the full Unicode naming grammar. Every cell and list item must be nonempty.
If a character has no formal name, use its first alias in NameAliases.txt, in file order.
UnicodeData range labels and legacy names are not character names.
With --check-icons, match the names against data/ucd/unicode.tsv, ignoring case.
For a base character followed by one variation selector, the base name alone
is also accepted. Skip name checks for sequences containing code points absent
from the reference table. Whitespace is significant.
"""
examples = ["GREEK SMALL LETTER ALPHA", "DELETE", "GRINNING FACE, VARIATION SELECTOR-16"]
