[project]
name = "autokey-julia-unicode"
version = "0.2.0"
# Python 3.12.3 fixes csv.writer quoting of CR/LF with custom line terminators.
# gh-67044: https://github.com/python/cpython/issues/67044
requires-python = ">=3.12.3"
dependencies = []

[dependency-groups]
dev = [
    "autokey>=0.96.0",
    "prek>=0.5.11",
    "pyrefly>=1.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
    "tombi>=1.11.2",
]

[tool.ruff]
src = ["src/", "tests/"]
indent-width = 4
line-length = 88
target-version = "py312"
output-format = "concise"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "ANN",
    "C90",
    "COM",
    "CPY",
    "DTZ",
    "EM",
    "ERA",
    "FIX",
    "PLR",
    "PLW",
    "T20",
    "TD",
    "TRY",
    #
    "D102",
    "D105",
    "D107",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pytest]
testpaths = ["tests"]
pythonpath = ["."]

[tool.pyrefly]
python-version = "3.12"
output-format = "min-text"
search-path = ["src/", "."]

[tool.tombi]
lint.rules.tables-out-of-order = "off"
format.rules.indent-width = 4

[[tool.tombi.schemas]]
# XREF: https://tombi-toml.github.io/tombi/docs/formatter/auto-sorting/
path = "tombi://www.schemastore.org/pyproject.json"
include = ["pyproject.toml"]
format.rules.array-values-order.enabled = false
format.rules.table-keys-order.enabled = false
