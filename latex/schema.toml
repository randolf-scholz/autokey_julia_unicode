#:schema ../icons/schema-definition.json
# Package-context tables map LaTeX expressions to Unicode sequences.
# The shared definition validates the column vocabulary, not TSV contents.
# Export order: code_points, chars, mode, latex_code. Readers identify columns by name.

schema_version = 1
status = "draft"

[format]
column_order = ["code_points", "chars", "mode", "latex_code"]
encoding = "utf-8"
delimiter = "\t"
quotechar = '"'
doublequote = true
line_terminator = "\n"
header = true
allow_unknown_columns = false
item_type = "string"
# Full-string matches against decoded cells or individual list items.
item_pattern = '[\s\S]*'
# Split on the exact delimiter; allow_empty governs cells and list items.
list_separator = ", "

[columns]
[columns.code_points]
required = true
allow_empty = false
type = "list"
min_items = 1
item_pattern = 'U\+[0-9A-F]{4,6}'
description = """
Nonempty comma-space-separated list of Unicode scalar values, in order.
Use uppercase hexadecimal with at least four digits. Values must be U+0000
through U+10FFFF, excluding U+D800 through U+DFFF. Repetition is allowed.
Decoding the sequence must reproduce chars exactly when chars is present.
Mappings describe Unicode character identity, not TeX spacing or font metrics.
"""
examples = ["U+03B1", "U+003D, U+0338"]

[columns.chars]
required = false
allow_empty = false
type = "string"
description = """
Unicode text corresponding exactly to code_points, included for readability.
Preserve whitespace and code-point identity; do not strip or normalize it.
An absent column means consumers must derive chars from code_points.
"""
examples = ["α", "ä", "≠"]

[columns.mode]
required = true
allow_empty = false
type = "string"
item_pattern = "math|text|both"
description = """
The mode in which the expression is valid: math, text, or both. Both means the
same Unicode mapping is valid in either mode. It does not imply identical
spacing or styling. An expression with different mappings in each mode needs
separate rows for math and text; those rows must not overlap a both row.
"""
examples = ["math", "text", "both"]

[columns.latex_code]
required = true
allow_empty = false
type = "string"
item_pattern = '\\[\s\S]+'
description = """
A complete LaTeX command or expression, without surrounding math delimiters.
Arguments must be supplied when needed; a bare accent or font command is not
a complete expression. This is plain text, not a list. Each (latex_code, mode)
pair must be unique within the file. The file and its documentation specify
the package, engine, and font-encoding context required by its expressions.
"""
examples = ['\alpha', '\"{a}', '\not=']
